<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到页面｜大悲心</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d1410">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#1d1410; --card:#2a201a; --gold:#c9a25e; --gold-dim:#8f7344; --text:#efe6d8; --text-dim:#b3a693; --line:#3d2f24; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    font-family:"Noto Serif TC","Noto Serif SC","Source Han Serif SC","STKaiti","KaiTi","DFKai-SB","STSong","SimSun",serif;
    line-height:1.8;
  }
  .lotus { font-size:34px; color:var(--gold); }
  h1 { color:var(--gold); font-size:28px; letter-spacing:.2em; margin:10px 0 6px; font-weight:600; }
  p { color:var(--text-dim); font-size:15px; margin-bottom:22px; }
  .links { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .links a {
    color:var(--gold); text-decoration:none; border:1px solid var(--line); border-radius:999px;
    padding:6px 18px; font-size:14px; letter-spacing:.1em; background:var(--card);
  }
  .links a:hover { border-color:var(--gold-dim); }
</style>
</head>
<body>
<div>
  <div class="lotus">☸</div>
  <h1>找不到页面</h1>
  <p>此页不存在，或已搬到新地址。</p>
  <div class="links">
    <a href="/">首页</a>
    <a href="/dabei/">大悲咒 · 八十四相</a>
    <a href="/usnisa/">佛顶尊胜陀罗尼</a>
    <a href="/wiki/">灵界志</a>
  </div>
</div>
</body>
</html>
